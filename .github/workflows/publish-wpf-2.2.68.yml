name: Verify published WPF 2.2.68
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-wpf-2.2.68.yml
permissions:
  contents: write
concurrency:
  group: vizon-wpf-release-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'vizonautomacao/vizon-vendas-desktop-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify the exact automatic updater URL and published installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          REPO="vizonautomacao/vizon-vendas-desktop-releases"
          BASE="https://api.github.com/repos/"+REPO
          RID=434282035
          TAG="v2.2.67"
          EXPECTED_HASH="b57995e08fa6b47d81e805b98153ee06f7de7d7846085f55a0cbd59cf8ed4f42"
          MANIFEST_HASH="87c9022bb4ec63ed00017466bca11d39f7c8fc3f2c1eade7a74e4a2f6f1910f3"
          EXE="VIZON-VENDAS-Setup-2.2.68-Windows10-x86-x64.exe"
          LATEST="https://github.com/"+REPO+"/releases/latest/download/latest.json"
          DIRECT="https://github.com/"+REPO+"/releases/download/"+TAG+"/latest.json"
          def check(ok,msg):
              if not ok:
                  raise RuntimeError(msg)
          def api(path,method="GET",payload=None):
              req=urllib.request.Request(BASE+path,data=json.dumps(payload).encode() if payload is not None else None,method=method,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"VIZON-WPF-publication-verifier","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=90) as response:
                  return json.loads(response.read())
          def raw(url,kind="application/octet-stream"):
              req=urllib.request.Request(url,headers={"User-Agent":"VIZON-WPF-update-check","Cache-Control":"no-cache","Accept":kind})
              with urllib.request.urlopen(req,timeout=120) as response:
                  return response.read()
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          release=api("/releases/latest")
          check(release["id"]==RID and release["tag_name"]==TAG,"Release identity changed")
          assets={a["name"]:a for a in release["assets"]}
          check(assets[EXE]["size"]==98993434 and assets[EXE]["digest"]=="sha256:"+EXPECTED_HASH,"Published installer metadata differs")
          check(assets["latest.json"]["digest"]=="sha256:"+MANIFEST_HASH,"Published manifest differs")
          check(assets["latest-2.2.67-710453944.json"]["digest"]=="sha256:331a0c6fbb8955530833f999d2aa2c07e6b4c9588e361f82c526f1ff32cdbd7b","Previous manifest is not preserved")
          manifest_bytes=raw(BASE+"/releases/assets/"+str(assets["latest.json"]["id"]))
          print("CANONICAL ASSET: "+manifest_bytes.decode("utf-8-sig"),flush=True)
          check(digest(manifest_bytes)==MANIFEST_HASH,"Canonical manifest bytes differ")
          expected=json.loads(manifest_bytes)
          check(expected["version"]=="2.2.68" and expected["sha256"].lower()==EXPECTED_HASH and expected["fileName"]==EXE,"Canonical manifest fields differ")
          check(expected["downloadUrl"]=="https://github.com/"+REPO+"/releases/download/"+TAG+"/"+EXE,"Manifest points to another installer")
          check(digest(raw(expected["downloadUrl"]))==EXPECTED_HASH,"Public installer download integrity check failed")
          print("PUBLIC INSTALLER DOWNLOAD VERIFIED",flush=True)
          for label,url in [("direct-tag",DIRECT+"?verify="+str(time.time_ns())),("latest-query",LATEST+"?verify="+str(time.time_ns()))]:
              try:
                  response=raw(url,"application/json")
                  print("DIAGNOSTIC "+label+": "+response.decode("utf-8-sig"),flush=True)
              except Exception as error:
                  print("DIAGNOSTIC "+label+": "+type(error).__name__,flush=True)
          verified=False
          for attempt in range(24):
              try:
                  current_bytes=raw(LATEST,"application/json")
                  current=json.loads(current_bytes)
                  print("EXACT UPDATER ENDPOINT attempt "+str(attempt+1)+": version="+str(current.get("version"))+" sha256="+digest(current_bytes),flush=True)
                  if current==expected:
                      verified=True
                      break
              except (urllib.error.HTTPError,json.JSONDecodeError) as error:
                  print("EXACT UPDATER ENDPOINT attempt "+str(attempt+1)+": "+str(error),flush=True)
              time.sleep(15)
          check(verified,"Exact automatic updater endpoint still differs from published manifest")
          final=api("/releases/latest")
          check(final["id"]==RID and final["tag_name"]==TAG,"Release changed during verification")
          header="# Atualização automática ativa: VIZON VENDAS 2.2.68 — FIX67-R2\n\nInstalador validado pelo responsável e publicado no Release existente, preservando os arquivos anteriores.\n\n**Instalador:** "+EXE+"\n\n**Tamanho:** 98.993.434 bytes\n\n**SHA-256:** "+EXPECTED_HASH+"\n\n---\n\n"
          if not (final.get("body") or "").startswith("# Atualização automática ativa: VIZON VENDAS 2.2.68"):
              api("/releases/"+str(RID),method="PATCH",payload={"name":"VIZON VENDAS 2.2.68 — FIX67-R2 (canal existente)","body":header+(final.get("body") or "")})
          print("PUBLISHED AND VERIFIED: 2.2.68",flush=True)
          print("LIVE MANIFEST: "+json.dumps(expected,ensure_ascii=False),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("# WPF 2.2.68 published and verified\n\nExisting Release preserved. Exact automatic updater URL returned version 2.2.68. Full public installer download passed SHA-256 verification. Previous assets and manifest preserved.\n\nSHA-256: "+EXPECTED_HASH+"\n")
          PY
