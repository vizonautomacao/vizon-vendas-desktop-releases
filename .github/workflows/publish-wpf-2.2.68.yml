name: Publish validated WPF 2.2.68
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-wpf-2.2.68.yml
permissions:
  contents: write
concurrency:
  group: vizon-wpf-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'vizonautomacao/vizon-vendas-desktop-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify and publish to the existing automatic-update Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct, subprocess, sys, tempfile, time, urllib.error, urllib.parse, urllib.request, zipfile
          
          REPO="vizonautomacao/vizon-vendas-desktop-releases"
          API="https://api.github.com/repos/"+REPO
          RID=434282035
          TAG="v2.2.67"
          VERSION="2.2.68"
          EXE="VIZON-VENDAS-Setup-2.2.68-Windows10-x86-x64.exe"
          EXPECTED_HASH="b57995e08fa6b47d81e805b98153ee06f7de7d7846085f55a0cbd59cf8ed4f42"
          EXPECTED_SIZE=98993434
          EXE_URL="https://github.com/"+REPO+"/releases/download/"+TAG+"/"+EXE
          LATEST_URL="https://github.com/"+REPO+"/releases/latest/download/latest.json"
          
          def require(ok,message):
              if not ok:
                  raise RuntimeError(message)
          
          def api(path, method="GET", payload=None, data=None, content_type="application/json"):
              url=path if path.startswith("https://") else API+path
              require(url.startswith(API+"/") or url.startswith("https://uploads.github.com/repos/"+REPO+"/"), "Unexpected API target")
              body=data if data is not None else (json.dumps(payload).encode() if payload is not None else None)
              req=urllib.request.Request(url, data=body, method=method, headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "Content-Type":content_type,
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"VIZON-validated-WPF-publication"
              })
              with urllib.request.urlopen(req,timeout=180) as response:
                  result=response.read()
              return json.loads(result) if result else None
          
          def public(url):
              require(url.startswith("https://github.com/"+REPO+"/releases/"),"Unexpected download target")
              req=urllib.request.Request(url+("&" if "?" in url else "?")+"verify="+str(time.time_ns()),headers={"Cache-Control":"no-cache","User-Agent":"VIZON-WPF-integrity-check"})
              with urllib.request.urlopen(req,timeout=180) as response:
                  return response.read()
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          def assets():
              return {a["name"]:a for a in api("/releases/"+str(RID))["assets"]}
          
          def upload(name,data,kind):
              existing=assets().get(name)
              if existing:
                  require(existing["size"]==len(data) and sha(public(existing["browser_download_url"]))==sha(data),"Existing asset differs: "+name)
                  return existing
              uploaded=api("https://uploads.github.com/repos/"+REPO+"/releases/"+str(RID)+"/assets?name="+urllib.parse.quote(name,safe=""),method="POST",data=data,content_type=kind)
              require(uploaded["state"]=="uploaded" and uploaded["size"]==len(data),"Incomplete upload: "+name)
              require(uploaded.get("digest") in (None,"sha256:"+sha(data)),"GitHub digest mismatch: "+name)
              return uploaded
          
          release=api("/releases/latest")
          require(release["id"]==RID and release["tag_name"]==TAG,"Latest Release changed")
          require(not release["draft"] and not release["prerelease"] and not release.get("immutable"),"Existing Release is not writable")
          previous={a["name"]:a for a in release["assets"]}
          require("latest.json" in previous,"Existing automatic updater manifest is missing")
          old_asset=previous["latest.json"]
          old_bytes=public(LATEST_URL)
          old_manifest=json.loads(old_bytes)
          print("CURRENT MANIFEST: "+json.dumps(old_manifest),flush=True)
          require(old_manifest.get("version") in ("2.2.67",VERSION),"Unexpected automatic updater version")
          
          work=pathlib.Path(tempfile.mkdtemp(prefix="vizon-wpf268-"))
          helper_dir=work/"helpers"
          helper_dir.mkdir(mode=0o700)
          helper_sources=json.loads("{\"library_file_transfer.py\":\"#!/usr/bin/env python3\\n# ruff: noqa: TID251\\nimport argparse\\nimport errno\\nimport json\\nimport os\\nimport re\\nimport shutil\\nimport subprocess\\nimport sys\\nimport tempfile\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\nfrom collections.abc import Iterator, Mapping\\nfrom contextlib import contextmanager\\nfrom dataclasses import dataclass\\nfrom pathlib import Path\\nfrom threading import Thread\\nfrom time import monotonic\\nfrom typing import TYPE_CHECKING, Literal, TypedDict\\n\\nif TYPE_CHECKING:\\n    from library_hosted_apps import HostedAppsClient\\n\\nLIBRARY_FILE_ID_XATTR_NAME = \\\"user.library-file-id\\\"\\n_COMPLETION_REPORT_BUDGET_SECONDS = 2.0\\n_COMPLETION_REPORT_BATCH_SIZE = 20\\n\\n\\nclass _MaterializeCompletion(TypedDict):\\n    completion_token: str\\n    outcome: Literal[\\\"success\\\", \\\"failure\\\"]\\n\\n\\nclass DownloadCompletionReporter:\\n    def __init__(self, source_client: \\\"HostedAppsClient | None\\\" = None) -> None:\\n        self.source_client = source_client\\n        self.items: list[_MaterializeCompletion] = []\\n\\n    @contextmanager\\n    def observe(\\n        self, transfer: Mapping[str, object], *, defer_success: bool = False\\n    ) -> Iterator[None]:\\n        token = transfer.get(\\\"completion_token\\\")\\n        if not isinstance(token, str) or not 0 < len(token) <= 128:\\n            yield\\n            return\\n        outcome: Literal[\\\"success\\\", \\\"failure\\\"] = \\\"failure\\\"\\n        try:\\n            yield\\n            outcome = \\\"success\\\"\\n        finally:\\n            if outcome == \\\"failure\\\" or not defer_success:\\n                self.items.append({\\\"completion_token\\\": token, \\\"outcome\\\": outcome})\\n\\n    def flush(self) -> None:\\n        if not self.items:\\n            return\\n        items, self.items = self.items, []\\n        deadline = monotonic() + _COMPLETION_REPORT_BUDGET_SECONDS\\n\\n        def report() -> None:\\n            try:\\n                script_directory = str(Path(__file__).resolve().parent)\\n                if script_directory not in sys.path:\\n                    sys.path.insert(0, script_directory)\\n                # Old standalone copies may omit this optional reporting companion.\\n                from library_hosted_apps import HostedAppsClient\\n\\n                client = (self.source_client or HostedAppsClient()).fork_for_tool(\\n                    \\\"connector_openai_library\\\", \\\"report_materialize_completion\\\"\\n                )\\n                for offset in range(0, len(items), _COMPLETION_REPORT_BATCH_SIZE):\\n                    remaining = deadline - monotonic()\\n                    if remaining <= 0:\\n                        return\\n                    client.call_tool(\\n                        \\\"connector_openai_library\\\",\\n                        \\\"report_materialize_completion\\\",\\n                        {\\\"items\\\": items[offset : offset + _COMPLETION_REPORT_BATCH_SIZE]},\\n                        timeout_seconds=remaining,\\n                    )\\n            except Exception:\\n                # Missing or failed telemetry leaves completion unknown server-side.\\n                return\\n\\n        try:\\n            # Socket timeouts alone do not bound DNS resolution or a trickling response.\\n            worker = Thread(target=report, daemon=True)\\n            worker.start()\\n            worker.join(timeout=max(0, deadline - monotonic()))\\n        except Exception:\\n            return\\n\\n\\nclass LibraryFileTransferError(Exception):\\n    pass\\n\\n\\ndef require_object(value: object, label: str) -> dict[str, object]:\\n    if not isinstance(value, dict):\\n        raise LibraryFileTransferError(f\\\"{label} must be a JSON object\\\")\\n    result: dict[str, object] = {}\\n    for key, item in value.items():\\n        if not isinstance(key, str):\\n            raise LibraryFileTransferError(f\\\"{label} keys must be strings\\\")\\n        result[key] = item\\n    return result\\n\\n\\ndef require_string(value: object, label: str, *, allow_empty: bool = False) -> str:\\n    if not isinstance(value, str) or (not allow_empty and not value):\\n        qualification = \\\"\\\" if allow_empty else \\\" non-empty\\\"\\n        raise LibraryFileTransferError(f\\\"{label} must be a{qualification} string\\\")\\n    return value\\n\\n\\n@dataclass(frozen=True)\\nclass ExtendedAttribute:\\n    name: str\\n    value: str\\n\\n    @classmethod\\n    def parse(cls, value: object, index: int) -> \\\"ExtendedAttribute\\\":\\n        payload = require_object(value, f\\\"xattrs[{index}]\\\")\\n        return cls(\\n            name=require_string(payload.get(\\\"name\\\"), f\\\"xattrs[{index}].name\\\"),\\n            value=require_string(\\n                payload.get(\\\"value\\\"),\\n                f\\\"xattrs[{index}].value\\\",\\n                allow_empty=True,\\n            ),\\n        )\\n\\n    def apply(self, path: Path | int) -> None:\\n        encoded_value = self.value.encode()\\n        if sys.platform == \\\"darwin\\\":\\n            if isinstance(path, int):\\n                raise LibraryFileTransferError(\\\"descriptor attributes require Linux\\\")\\n            actual_value = self._apply_darwin(path, encoded_value)\\n        elif isinstance(path, int):\\n            # A verified file may already carry metadata. Never overwrite another\\n            # identity, including one added between the preceding check and setxattr.\\n            try:\\n                os.setxattr(path, self.name, encoded_value, os.XATTR_CREATE)\\n            except OSError as error:\\n                if error.errno != errno.EEXIST:\\n                    raise\\n            actual_value = os.getxattr(path, self.name)\\n        else:\\n            os.setxattr(path, self.name, encoded_value)\\n            actual_value = os.getxattr(path, self.name)\\n        if actual_value != encoded_value:\\n            raise LibraryFileTransferError(f\\\"failed to verify extended attribute {self.name!r}\\\")\\n\\n    def _apply_darwin(self, path: Path, encoded_value: bytes) -> bytes:\\n        try:\\n            subprocess.run(\\n                [\\\"/usr/bin/xattr\\\", \\\"-wx\\\", self.name, encoded_value.hex(), path],\\n                check=True,\\n                capture_output=True,\\n            )\\n            result = subprocess.run(\\n                [\\\"/usr/bin/xattr\\\", \\\"-px\\\", self.name, path],\\n                check=True,\\n                capture_output=True,\\n                text=True,\\n            )\\n        except subprocess.CalledProcessError as exc:\\n            raise LibraryFileTransferError(\\n                f\\\"failed to apply extended attribute {self.name!r}\\\"\\n            ) from exc\\n        return bytes.fromhex(result.stdout)\\n\\n\\ndef parse_xattrs(value: object) -> tuple[ExtendedAttribute, ...]:\\n    if not isinstance(value, list):\\n        raise LibraryFileTransferError(\\\"xattrs must be a JSON array\\\")\\n    return tuple(ExtendedAttribute.parse(item, index) for index, item in enumerate(value))\\n\\n\\ndef include_library_file_id_xattr(\\n    xattrs: tuple[ExtendedAttribute, ...],\\n    library_file_id: str | None,\\n) -> tuple[ExtendedAttribute, ...]:\\n    if library_file_id is None:\\n        return xattrs\\n    return (\\n        *(xattr for xattr in xattrs if xattr.name != LIBRARY_FILE_ID_XATTR_NAME),\\n        ExtendedAttribute(name=LIBRARY_FILE_ID_XATTR_NAME, value=library_file_id),\\n    )\\n\\n\\ndef _is_trusted_estuary_download(download_url: str) -> bool:\\n    download = urllib.parse.urlsplit(download_url)\\n    hosted_apps = urllib.parse.urlsplit(\\n        os.environ.get(\\\"CODEX_APPS_MCP_URL\\\", \\\"https://chatgpt.com/backend-api/wham/apps\\\")\\n    )\\n    try:\\n        same_origin = (download.hostname, 443 if download.port is None else download.port) == (\\n            hosted_apps.hostname,\\n            443 if hosted_apps.port is None else hosted_apps.port,\\n        )\\n    except ValueError:\\n        return False\\n    prefix = \\\"/backend-api/estuary/public_content/enc/\\\"\\n    return (\\n        download.scheme == hosted_apps.scheme == \\\"https\\\"\\n        and same_origin\\n        and download.username is None\\n        and download.password is None\\n        and download.path.startswith(prefix)\\n        and re.fullmatch(r\\\"[A-Za-z0-9_-]+={0,2}\\\", download.path[len(prefix) :]) is not None\\n        and not download.query\\n        and not download.fragment\\n    )\\n\\n\\ndef _estuary_auth_headers(download_url: str) -> dict[str, str]:\\n    if not _is_trusted_estuary_download(download_url):\\n        return {}\\n    authorization = os.environ.get(\\\"CODEX_APPS_AUTHORIZATION\\\", \\\"\\\").strip()\\n    account_id = os.environ.get(\\\"CODEX_APPS_CHATGPT_ACCOUNT_ID\\\", \\\"\\\").strip()\\n    if not authorization:\\n        token = os.environ.get(\\\"CODEX_CONNECTORS_TOKEN\\\", \\\"\\\").strip()\\n        if not token:\\n            auth_path = Path(\\n                os.environ.get(\\\"CODEX_AUTH_PATH\\\")\\n                or Path(os.environ.get(\\\"CODEX_HOME\\\", Path.home() / \\\".codex\\\")) / \\\"auth.json\\\"\\n            ).expanduser()\\n            try:\\n                payload = require_object(json.loads(auth_path.read_text()), \\\"Codex auth\\\")\\n                tokens = require_object(payload.get(\\\"tokens\\\"), \\\"Codex auth tokens\\\")\\n                token = require_string(tokens.get(\\\"access_token\\\"), \\\"Codex access token\\\")\\n                if token == \\\"access_token\\\":\\n                    return {}\\n                account_id = account_id or str(tokens.get(\\\"account_id\\\") or \\\"\\\")\\n            except (OSError, json.JSONDecodeError, LibraryFileTransferError):\\n                return {}\\n        authorization = f\\\"Bearer {token}\\\"\\n    headers = {\\\"Authorization\\\": authorization}\\n    if account_id:\\n        headers[\\\"ChatGPT-Account-ID\\\"] = account_id\\n    return headers\\n\\n\\nclass _NoAuthenticatedRedirect(urllib.request.HTTPRedirectHandler):\\n    def redirect_request(self, *_args: object) -> None:\\n        return None\\n\\n\\n@dataclass(frozen=True)\\nclass LibraryFileTransfer:\\n    download_url: str\\n    headers: dict[str, str]\\n    library_file_id: str | None\\n    xattrs: tuple[ExtendedAttribute, ...]\\n\\n    @classmethod\\n    def parse(cls, value: object) -> \\\"LibraryFileTransfer\\\":\\n        payload = require_object(value, \\\"transfer\\\")\\n        raw_headers = require_object(payload.get(\\\"headers\\\", {}), \\\"transfer.headers\\\")\\n        headers = {\\n            name: require_string(header_value, f\\\"transfer.headers[{name!r}]\\\")\\n            for name, header_value in raw_headers.items()\\n        }\\n        return cls(\\n            download_url=require_string(payload.get(\\\"download_url\\\"), \\\"transfer.download_url\\\"),\\n            headers=headers,\\n            library_file_id=(\\n                require_string(payload[\\\"library_file_id\\\"], \\\"transfer.library_file_id\\\")\\n                if payload.get(\\\"library_file_id\\\") is not None\\n                else None\\n            ),\\n            xattrs=parse_xattrs([] if payload.get(\\\"xattrs\\\") is None else payload[\\\"xattrs\\\"]),\\n        )\\n\\n    def write_to(self, destination: Path) -> None:\\n        headers = {} if _is_trusted_estuary_download(self.download_url) else self.headers\\n        request = urllib.request.Request(self.download_url, headers=headers, method=\\\"GET\\\")\\n        auth_headers = _estuary_auth_headers(self.download_url)\\n        for name, value in auth_headers.items():\\n            request.add_unredirected_header(name, value)\\n        urlopen = (\\n            urllib.request.build_opener(_NoAuthenticatedRedirect()).open\\n            if auth_headers\\n            else urllib.request.urlopen\\n        )\\n        try:\\n            with (\\n                urlopen(request, timeout=300) as response,\\n                destination.open(\\\"wb\\\") as output,\\n            ):\\n                shutil.copyfileobj(response, output)\\n        except urllib.error.HTTPError as exc:\\n            raise LibraryFileTransferError(f\\\"download failed with HTTP status {exc.code}\\\") from exc\\n        except urllib.error.URLError as exc:\\n            raise LibraryFileTransferError(\\\"download failed\\\") from exc\\n\\n\\nclass LibraryFileMaterializer:\\n    def materialize(self, transfer: LibraryFileTransfer, destination: Path) -> None:\\n        self._require_absolute_path(destination)\\n        destination.parent.mkdir(parents=True, exist_ok=True)\\n        file_descriptor, temporary_name = tempfile.mkstemp(\\n            dir=destination.parent,\\n            prefix=f\\\".{destination.name}.\\\",\\n        )\\n        os.close(file_descriptor)\\n        temporary_path = Path(temporary_name)\\n        try:\\n            transfer.write_to(temporary_path)\\n            self.apply_xattrs(\\n                include_library_file_id_xattr(\\n                    transfer.xattrs,\\n                    transfer.library_file_id,\\n                ),\\n                temporary_path,\\n            )\\n            os.replace(temporary_path, destination)\\n        finally:\\n            temporary_path.unlink(missing_ok=True)\\n\\n    def apply_xattrs(\\n        self,\\n        xattrs: tuple[ExtendedAttribute, ...],\\n        path: Path | int,\\n    ) -> None:\\n        if not isinstance(path, int):\\n            self._require_absolute_path(path)\\n            if not path.is_file():\\n                raise LibraryFileTransferError(f\\\"file does not exist: {path}\\\")\\n        for xattr in xattrs:\\n            xattr.apply(path)\\n\\n    @staticmethod\\n    def _require_absolute_path(path: Path) -> None:\\n        if not path.is_absolute():\\n            raise LibraryFileTransferError(\\\"file path must be absolute\\\")\\n\\n\\ndef load_stdin_json() -> object:\\n    if sys.stdin.isatty():\\n        raise LibraryFileTransferError(\\\"stdin must be closed after one complete JSON request\\\")\\n    try:\\n        value: object = json.load(sys.stdin)\\n    except json.JSONDecodeError as exc:\\n        raise LibraryFileTransferError(\\\"stdin must contain valid JSON\\\") from exc\\n    return value\\n\\n\\ndef build_parser() -> argparse.ArgumentParser:\\n    parser = argparse.ArgumentParser(\\n        description=\\\"Materialize a ChatGPT Library transfer and preserve its extended attributes.\\\",\\n    )\\n    subparsers = parser.add_subparsers(dest=\\\"command\\\", required=True)\\n    materialize_parser = subparsers.add_parser(\\\"materialize\\\")\\n    materialize_parser.add_argument(\\\"destination\\\", type=Path)\\n    apply_parser = subparsers.add_parser(\\\"apply-xattrs\\\")\\n    apply_parser.add_argument(\\\"path\\\", type=Path)\\n    apply_parser.add_argument(\\\"library_file_id\\\", nargs=\\\"?\\\")\\n    return parser\\n\\n\\ndef main(argv: list[str]) -> int:\\n    args = build_parser().parse_args(argv)\\n    materializer = LibraryFileMaterializer()\\n    reporter = DownloadCompletionReporter()\\n    try:\\n        payload = load_stdin_json()\\n        if args.command == \\\"materialize\\\":\\n            transfer = require_object(payload, \\\"transfer\\\")\\n            with reporter.observe(transfer):\\n                materializer.materialize(LibraryFileTransfer.parse(transfer), args.destination)\\n            print(args.destination)\\n        else:\\n            transfer = require_object(payload, \\\"transfer\\\") if isinstance(payload, dict) else {}\\n            with reporter.observe(transfer):\\n                if transfer:\\n                    workspace_path = Path(\\n                        require_string(transfer.get(\\\"workspace_path\\\"), \\\"workspace_path\\\")\\n                    )\\n                    if (\\n                        not workspace_path.is_absolute()\\n                        or workspace_path.resolve() != args.path.resolve()\\n                    ):\\n                        raise LibraryFileTransferError(\\n                            \\\"workspace_path does not match the destination\\\"\\n                        )\\n                    library_file_id_value = transfer.get(\\\"library_file_id\\\")\\n                    library_file_id = (\\n                        require_string(library_file_id_value, \\\"library_file_id\\\")\\n                        if library_file_id_value is not None\\n                        else None\\n                    )\\n                    if args.library_file_id is not None and args.library_file_id != library_file_id:\\n                        raise LibraryFileTransferError(\\n                            \\\"library_file_id does not match the transfer\\\"\\n                        )\\n                    xattrs_value = transfer.get(\\\"xattrs\\\")\\n                    xattrs = parse_xattrs([] if xattrs_value is None else xattrs_value)\\n                else:\\n                    library_file_id = require_string(args.library_file_id, \\\"library_file_id\\\")\\n                    xattrs = parse_xattrs(payload)\\n                materializer.apply_xattrs(\\n                    include_library_file_id_xattr(xattrs, library_file_id), args.path\\n                )\\n            print(args.path)\\n    except (LibraryFileTransferError, OSError) as exc:\\n        print(f\\\"library file transfer failed: {exc}\\\", file=sys.stderr)\\n        return 1\\n    finally:\\n        reporter.flush()\\n    return 0\\n\\n\\nif __name__ == \\\"__main__\\\":\\n    raise SystemExit(main(sys.argv[1:]))\\n\",\"library_hosted_apps.py\":\"#!/usr/bin/env python3\\n# ruff: noqa: TID251\\nimport json\\nimport os\\nimport socket\\nimport ssl\\nimport urllib.error\\nimport urllib.request\\nfrom copy import deepcopy\\nfrom dataclasses import dataclass\\nfrom pathlib import Path\\nfrom threading import Lock\\nfrom time import monotonic\\n\\n\\nclass HostedAppsError(Exception):\\n    pass\\n\\n\\nclass HostedAppsToolError(HostedAppsError):\\n    def __init__(self, message: str, result: dict[str, object]) -> None:\\n        super().__init__(message)\\n        self.result = result\\n\\n\\n_MAX_TOOL_LIST_PAGES = 100\\n\\n\\ndef _url_error_category(reason: object) -> str:\\n    if isinstance(reason, TimeoutError):\\n        return \\\"timeout\\\"\\n    if isinstance(reason, socket.gaierror):\\n        return \\\"DNS\\\"\\n    if isinstance(reason, ssl.SSLError):\\n        return \\\"TLS\\\"\\n    if isinstance(reason, ConnectionError):\\n        return \\\"connection\\\"\\n    return \\\"network\\\"\\n\\n\\ndef _require_object(value: object, label: str) -> dict[str, object]:\\n    if not isinstance(value, dict):\\n        raise HostedAppsError(f\\\"{label} must be a JSON object\\\")\\n    if not all(isinstance(key, str) for key in value):\\n        raise HostedAppsError(f\\\"{label} keys must be strings\\\")\\n    return value\\n\\n\\ndef _require_string(value: object, label: str) -> str:\\n    if not isinstance(value, str) or not value:\\n        raise HostedAppsError(f\\\"{label} must be a non-empty string\\\")\\n    return value\\n\\n\\n@dataclass(frozen=True)\\nclass HostedAppTool:\\n    name: str\\n    meta: dict[str, object]\\n\\n\\nclass HostedAppsClient:\\n    \\\"\\\"\\\"Call authenticated hosted-app tools from the active Codex session.\\\"\\\"\\\"\\n\\n    def __init__(self) -> None:\\n        self.endpoint = os.environ.get(\\n            \\\"CODEX_APPS_MCP_URL\\\",\\n            \\\"https://chatgpt.com/backend-api/wham/apps\\\",\\n        )\\n        self._request_id = 0\\n        self._request_id_lock = Lock()\\n        self._tools: list[HostedAppTool] = []\\n        self._tool_lock = Lock()\\n\\n    def fork_for_tool(self, connector_id: str, tool_name: str) -> \\\"HostedAppsClient\\\":\\n        client = HostedAppsClient()\\n        client.endpoint = self.endpoint\\n        if (\\n            connector_id == \\\"connector_openai_library\\\"\\n            and tool_name == \\\"report_materialize_completion\\\"\\n        ):\\n            for origin in (\\\"https://chatgpt.com\\\", \\\"https://chatgpt-staging.com\\\"):\\n                if self.endpoint in (\\n                    f\\\"{origin}/backend-api/wham/apps\\\",\\n                    f\\\"{origin}/backend-api/codex/apps\\\",\\n                    f\\\"{origin}/backend-api/ps/mcp\\\",\\n                ):\\n                    # This app-only callback is absent from public tool discovery.\\n                    # Its explicit binding also avoids discovery within the reporting budget.\\n                    client.endpoint = f\\\"{origin}/backend-api/ps/mcp\\\"\\n                    client._tools = [\\n                        HostedAppTool(\\n                            \\\"library.report_materialize_completion\\\",\\n                            {\\n                                \\\"connector_id\\\": connector_id,\\n                                \\\"_codex_apps\\\": {\\n                                    \\\"resource_uri\\\": (\\n                                        \\\"/connector_openai_library/\\\"\\n                                        \\\"implicit_link::connector_openai_library/\\\"\\n                                        \\\"report_materialize_completion\\\"\\n                                    ),\\n                                    \\\"contains_mcp_source\\\": False,\\n                                },\\n                            },\\n                        )\\n                    ]\\n                    return client\\n        if not self._tool_lock.acquire(blocking=False):\\n            return client\\n        try:\\n            tool = self._find_tool(connector_id, tool_name)\\n            if tool is not None:\\n                client._tools = [HostedAppTool(tool.name, deepcopy(tool.meta))]\\n        finally:\\n            self._tool_lock.release()\\n        return client\\n\\n    def call_tool(\\n        self,\\n        connector_id: str,\\n        tool_name: str,\\n        arguments: dict[str, object],\\n        *,\\n        timeout_seconds: float | None = None,\\n    ) -> dict[str, object]:\\n        if connector_id != \\\"connector_openai_library\\\":\\n            raise HostedAppsError(\\n                \\\"This Python helper only supports Library. Call other apps through \\\"\\n                \\\"the runtime's tools, directly or through code mode.\\\"\\n            )\\n        deadline = None if timeout_seconds is None else monotonic() + timeout_seconds\\n        tool = self._tool(connector_id, tool_name, deadline=deadline)\\n        params: dict[str, object] = {\\n            \\\"name\\\": tool.name,\\n            \\\"arguments\\\": arguments,\\n        }\\n        request_meta = self._request_meta(tool.meta)\\n        if request_meta:\\n            params[\\\"_meta\\\"] = request_meta\\n        result = self._rpc(\\\"tools/call\\\", params, deadline=deadline)\\n        if result.get(\\\"isError\\\") is True:\\n            raise HostedAppsToolError(f\\\"{tool_name} failed\\\", result)\\n        return result\\n\\n    def _tool(self, connector_id: str, tool_name: str, *, deadline: float | None) -> HostedAppTool:\\n        if deadline is None:\\n            self._tool_lock.acquire()\\n        elif not self._tool_lock.acquire(timeout=self._request_timeout(deadline)):\\n            raise HostedAppsError(\\\"hosted apps request deadline expired\\\")\\n        try:\\n            tool = self._find_tool(connector_id, tool_name)\\n            return tool or self._load_tool(connector_id, tool_name, deadline=deadline)\\n        finally:\\n            self._tool_lock.release()\\n\\n    def _find_tool(\\n        self,\\n        connector_id: str,\\n        tool_name: str,\\n    ) -> HostedAppTool | None:\\n        return next(\\n            (tool for tool in self._tools if self._is_tool(tool, connector_id, tool_name)),\\n            None,\\n        )\\n\\n    def _load_tool(\\n        self, connector_id: str, tool_name: str, *, deadline: float | None\\n    ) -> HostedAppTool:\\n        cursor: str | None = None\\n        seen_cursors: set[str] = set()\\n        for _ in range(_MAX_TOOL_LIST_PAGES):\\n            params: dict[str, object] = {}\\n            if cursor is not None:\\n                params[\\\"cursor\\\"] = cursor\\n            result = self._rpc(\\\"tools/list\\\", params, deadline=deadline)\\n            tools = result.get(\\\"tools\\\")\\n            if not isinstance(tools, list):\\n                raise HostedAppsError(\\\"hosted apps tools/list did not return a tools array\\\")\\n            discovered: list[HostedAppTool] = []\\n            for index, tool_value in enumerate(tools):\\n                tool = _require_object(tool_value, f\\\"tools[{index}]\\\")\\n                name = tool.get(\\\"name\\\")\\n                meta = tool.get(\\\"_meta\\\")\\n                if not isinstance(name, str) or not name or not isinstance(meta, dict):\\n                    continue\\n                discovered.append(\\n                    HostedAppTool(\\n                        name=name,\\n                        meta=meta,\\n                    )\\n                )\\n            self._tools.extend(discovered)\\n            matched_tool = self._find_tool(connector_id, tool_name)\\n            if matched_tool is not None:\\n                return matched_tool\\n            next_cursor = result.get(\\\"nextCursor\\\", result.get(\\\"next_cursor\\\"))\\n            if not isinstance(next_cursor, str) or not next_cursor:\\n                break\\n            if next_cursor in seen_cursors:\\n                raise HostedAppsError(\\\"hosted apps tools/list cursor repeated\\\")\\n            seen_cursors.add(next_cursor)\\n            cursor = next_cursor\\n        raise HostedAppsError(f\\\"Library {tool_name} is not available\\\")\\n\\n    @staticmethod\\n    def _is_tool(\\n        tool: HostedAppTool,\\n        connector_id: str,\\n        tool_name: str,\\n    ) -> bool:\\n        discovered_connector_id = next(\\n            (\\n                tool.meta.get(key)\\n                for key in (\\\"connector_id\\\", \\\"connectorId\\\", \\\"app_id\\\", \\\"appId\\\")\\n                if tool.meta.get(key) is not None\\n            ),\\n            None,\\n        )\\n        return discovered_connector_id == connector_id and (\\n            tool.name == tool_name\\n            or tool.name.endswith(f\\\"_{tool_name}\\\")\\n            or tool.name.endswith(f\\\".{tool_name}\\\")\\n        )\\n\\n    def _rpc(\\n        self,\\n        method: str,\\n        params: dict[str, object],\\n        *,\\n        deadline: float | None = None,\\n    ) -> dict[str, object]:\\n        with self._request_id_lock:\\n            self._request_id += 1\\n            request_id = self._request_id\\n        body = json.dumps(\\n            {\\n                \\\"jsonrpc\\\": \\\"2.0\\\",\\n                \\\"id\\\": request_id,\\n                \\\"method\\\": method,\\n                \\\"params\\\": params,\\n            },\\n            separators=(\\\",\\\", \\\":\\\"),\\n        ).encode()\\n        request = urllib.request.Request(\\n            self.endpoint,\\n            data=body,\\n            headers={\\n                \\\"Accept\\\": \\\"application/json, text/event-stream\\\",\\n                \\\"Content-Type\\\": \\\"application/json\\\",\\n                **self._auth_headers(),\\n            },\\n            method=\\\"POST\\\",\\n        )\\n        try:\\n            with urllib.request.urlopen(\\n                request,\\n                timeout=self._request_timeout(deadline),\\n                context=self._ssl_context(),\\n            ) as response:\\n                response_body = response.read().decode()\\n                content_type = response.headers.get(\\\"content-type\\\", \\\"\\\")\\n        except urllib.error.HTTPError as exc:\\n            raise HostedAppsError(\\n                f\\\"hosted apps {method} request failed with HTTP status {exc.code}\\\"\\n            ) from exc\\n        except urllib.error.URLError as exc:\\n            raise HostedAppsError(\\n                f\\\"hosted apps {method} request failed: {_url_error_category(exc.reason)}\\\"\\n            ) from exc\\n        payload = self._decode_response(response_body, content_type)\\n        if payload.get(\\\"error\\\") is not None:\\n            raise HostedAppsError(f\\\"hosted apps {method} RPC failed\\\")\\n        return _require_object(payload.get(\\\"result\\\"), \\\"hosted apps RPC result\\\")\\n\\n    @staticmethod\\n    def _request_timeout(deadline: float | None) -> float:\\n        if deadline is None:\\n            return 90\\n        remaining = deadline - monotonic()\\n        if remaining <= 0:\\n            raise HostedAppsError(\\\"hosted apps request deadline expired\\\")\\n        return min(90, remaining)\\n\\n    @staticmethod\\n    def _request_meta(tool_meta: dict[str, object]) -> dict[str, object]:\\n        request_meta = dict(tool_meta)\\n        thread_id = os.environ.get(\\\"CODEX_THREAD_ID\\\", \\\"\\\").strip()\\n        if thread_id:\\n            request_meta[\\\"threadId\\\"] = thread_id\\n        session_id = os.environ.get(\\\"CODEX_SESSION_ID\\\", \\\"\\\").strip()\\n        if thread_id and session_id and session_id != thread_id:\\n            existing_turn_metadata = request_meta.get(\\\"x-codex-turn-metadata\\\")\\n            turn_metadata = (\\n                dict(existing_turn_metadata) if isinstance(existing_turn_metadata, dict) else {}\\n            )\\n            turn_metadata[\\\"session_id\\\"] = session_id\\n            turn_metadata[\\\"thread_id\\\"] = thread_id\\n            # The gateway reads the outer IDs for request correlation. It only\\n            # forwards declared first-party action metadata from mcp_request_meta.\\n            existing_action_meta = turn_metadata.get(\\\"mcp_request_meta\\\")\\n            action_meta = (\\n                dict(existing_action_meta) if isinstance(existing_action_meta, dict) else {}\\n            )\\n            action_meta[\\\"x-codex-turn-metadata\\\"] = {\\n                \\\"session_id\\\": session_id,\\n                \\\"thread_id\\\": thread_id,\\n            }\\n            turn_metadata[\\\"mcp_request_meta\\\"] = action_meta\\n            request_meta[\\\"x-codex-turn-metadata\\\"] = turn_metadata\\n        return request_meta\\n\\n    def _auth_headers(self) -> dict[str, str]:\\n        account_id = os.environ.get(\\\"CODEX_APPS_CHATGPT_ACCOUNT_ID\\\", \\\"\\\").strip() or None\\n        authorization = os.environ.get(\\\"CODEX_APPS_AUTHORIZATION\\\", \\\"\\\").strip()\\n        if authorization:\\n            return self._with_account_id(authorization, account_id)\\n        connector_token = os.environ.get(\\\"CODEX_CONNECTORS_TOKEN\\\", \\\"\\\").strip()\\n        if connector_token:\\n            return self._with_account_id(f\\\"Bearer {connector_token}\\\", account_id)\\n        token, auth_account_id = self._auth_file_tokens()\\n        return self._with_account_id(\\n            f\\\"Bearer {token}\\\",\\n            account_id or auth_account_id,\\n        )\\n\\n    @staticmethod\\n    def _with_account_id(\\n        authorization: str,\\n        account_id: str | None,\\n    ) -> dict[str, str]:\\n        headers = {\\\"Authorization\\\": authorization}\\n        if account_id is not None:\\n            headers[\\\"ChatGPT-Account-ID\\\"] = account_id\\n        return headers\\n\\n    @staticmethod\\n    def _auth_file_tokens() -> tuple[str, str | None]:\\n        configured_path = os.environ.get(\\\"CODEX_AUTH_PATH\\\")\\n        if configured_path:\\n            auth_path = Path(configured_path).expanduser()\\n        elif os.environ.get(\\\"CODEX_HOME\\\"):\\n            auth_path = Path(os.environ[\\\"CODEX_HOME\\\"]).expanduser() / \\\"auth.json\\\"\\n        else:\\n            auth_path = Path.home() / \\\".codex\\\" / \\\"auth.json\\\"\\n        try:\\n            payload: object = json.loads(auth_path.read_text(encoding=\\\"utf-8\\\"))\\n            auth = _require_object(payload, \\\"Codex auth\\\")\\n            tokens = _require_object(auth.get(\\\"tokens\\\"), \\\"Codex auth tokens\\\")\\n            token = _require_string(tokens.get(\\\"access_token\\\"), \\\"Codex access token\\\")\\n            account_value = tokens.get(\\\"account_id\\\")\\n            account_id = (\\n                _require_string(account_value, \\\"Codex account id\\\")\\n                if account_value is not None\\n                else None\\n            )\\n        except (OSError, json.JSONDecodeError, HostedAppsError) as exc:\\n            raise HostedAppsError(f\\\"could not read Codex auth from {auth_path}\\\") from exc\\n        return token, account_id\\n\\n    @staticmethod\\n    def _ssl_context() -> ssl.SSLContext:\\n        for environment_name in (\\n            \\\"SSL_CERT_FILE\\\",\\n            \\\"REQUESTS_CA_BUNDLE\\\",\\n            \\\"CURL_CA_BUNDLE\\\",\\n        ):\\n            ca_bundle = os.environ.get(environment_name)\\n            if ca_bundle:\\n                return ssl.create_default_context(cafile=ca_bundle)\\n        default_ca_bundle = Path(\\\"/etc/ssl/certs/ca-certificates.crt\\\")\\n        if default_ca_bundle.exists():\\n            return ssl.create_default_context(cafile=default_ca_bundle)\\n        return ssl.create_default_context()\\n\\n    @classmethod\\n    def _decode_response(\\n        cls,\\n        body: str,\\n        content_type: str,\\n    ) -> dict[str, object]:\\n        if \\\"text/event-stream\\\" not in content_type.lower():\\n            try:\\n                value: object = json.loads(body)\\n            except json.JSONDecodeError as exc:\\n                raise HostedAppsError(\\\"hosted apps returned invalid JSON\\\") from exc\\n            return _require_object(value, \\\"hosted apps response\\\")\\n\\n        last_event: dict[str, object] | None = None\\n        data_lines: list[str] = []\\n        for line in (*body.splitlines(), \\\"\\\"):\\n            if not line:\\n                event = cls._decode_event(data_lines)\\n                if event is not None:\\n                    last_event = event\\n                data_lines = []\\n            elif line.startswith(\\\"data:\\\"):\\n                data_lines.append(line.removeprefix(\\\"data:\\\").lstrip())\\n        if last_event is None:\\n            raise HostedAppsError(\\\"hosted apps returned an empty event stream\\\")\\n        return last_event\\n\\n    @staticmethod\\n    def _decode_event(data_lines: list[str]) -> dict[str, object] | None:\\n        if not data_lines:\\n            return None\\n        candidate = \\\"\\\\n\\\".join(data_lines)\\n        if candidate.strip() == \\\"[DONE]\\\":\\n            return None\\n        try:\\n            value: object = json.loads(candidate)\\n        except json.JSONDecodeError:\\n            return None\\n        return value if isinstance(value, dict) else None\\n\"}")
